<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPP Chess Club — Election Results</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 2rem 1rem 5rem;
    position: relative;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #1c1c1c;
    background-image:
      linear-gradient(45deg, #242424 25%, transparent 25%),
      linear-gradient(-45deg, #242424 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #242424 75%),
      linear-gradient(-45deg, transparent 75%, #242424 75%);
    background-size: 48px 48px;
    background-position: 0 0, 0 24px, 24px -24px, -24px 0px;
    color: #e8e4de;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 85% 75% at 50% 40%, rgba(20,20,20,0.55) 0%, rgba(10,10,10,0.88) 100%);
    pointer-events: none; z-index: 0;
  }

  .wrap { max-width: 620px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── Auth screen ─────────────────────────────────────────────────────────── */
  #auth-screen {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    align-items: center; justify-content: center;
    background-color: #1c1c1c;
    background-image:
      linear-gradient(45deg, #242424 25%, transparent 25%),
      linear-gradient(-45deg, #242424 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #242424 75%),
      linear-gradient(-45deg, transparent 75%, #242424 75%);
    background-size: 48px 48px;
    background-position: 0 0, 0 24px, 24px -24px, -24px 0px;
  }
  #auth-screen::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 85% 75% at 50% 40%, rgba(20,20,20,0.55) 0%, rgba(10,10,10,0.88) 100%);
    pointer-events: none;
  }

  .auth-card {
    position: relative; z-index: 1;
    background: rgba(0,0,0,0.55);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    width: 100%; max-width: 360px;
    text-align: center;
  }
  .auth-icon { font-size: 42px; display: block; margin-bottom: 12px; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.9)); }
  .auth-card h2 { font-family: 'Georgia', serif; font-size: 20px; font-weight: normal; color: #f0ede8; margin-bottom: 5px; }
  .auth-card p { font-size: 12px; color: #555; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1.5rem; }

  .auth-card input {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 11px 14px;
    font-size: 15px; color: #f0ede8;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    outline: none; text-align: center; letter-spacing: 0.1em;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .auth-card input:focus { border-color: rgba(255,255,255,0.3); }
  .auth-card input::placeholder { color: #3a3a3a; letter-spacing: 0; }

  .auth-btn {
    width: 100%; padding: 12px; font-size: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.04em; cursor: pointer; border-radius: 8px;
    border: 0.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #f0ede8;
    transition: background 0.15s;
  }
  .auth-btn:hover { background: rgba(255,255,255,0.13); }

  .pwd-err {
    display: none; font-size: 12px; color: #c07070;
    margin-top: 10px;
  }

  /* ── Main content ────────────────────────────────────────────────────────── */
  #main-content { display: none; }

  .header { text-align: center; padding: 2.5rem 0 2rem; border-bottom: 0.5px solid rgba(255,255,255,0.1); margin-bottom: 2rem; }
  .chess-symbol { font-size: 48px; display: block; margin-bottom: 12px; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.9)); }
  .header h1 { font-family: 'Georgia', serif; font-size: 23px; font-weight: normal; color: #f0ede8; letter-spacing: 0.05em; margin-bottom: 5px; }
  .header .sub { font-size: 11px; color: #666; letter-spacing: 0.12em; text-transform: uppercase; }

  .stats { display: flex; gap: 12px; margin-bottom: 2rem; }
  .stat-card { flex: 1; background: rgba(0,0,0,0.5); border: 0.5px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 1.1rem; text-align: center; }
  .stat-num { font-family: 'Georgia', serif; font-size: 30px; color: #f0ede8; }
  .stat-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

  .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
  .last-updated { font-size: 11px; color: #444; }
  .refresh-btn { font-size: 11px; padding: 6px 14px; border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.4); color: #888; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .refresh-btn:hover { color: #f0ede8; border-color: rgba(255,255,255,0.3); }

  .section { margin-bottom: 1.75rem; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ccc; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .section-title::before { content: ''; width: 3px; height: 3px; border-radius: 50%; background: #fff; flex-shrink: 0; }
  .section-line { flex: 1; height: 0.5px; background: rgba(255,255,255,0.08); }

  .candidate-row { position: relative; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.06); border-radius: 9px; padding: 12px 15px; margin-bottom: 8px; background: rgba(0,0,0,0.45); }
  .candidate-row:last-child { margin-bottom: 0; }
  .candidate-row.leader { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,0.04); border-radius: 9px; transition: width 1s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
  .candidate-row.leader .bar-fill { background: rgba(255,255,255,0.07); }
  .row-content { position: relative; display: flex; align-items: center; gap: 12px; }

  .rank-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .rank-1 { background: rgba(255,255,255,0.15); color: #f0ede8; }
  .rank-2 { background: rgba(255,255,255,0.08); color: #aaa; }
  .rank-3 { background: rgba(255,255,255,0.05); color: #777; }
  .rank-other { background: rgba(255,255,255,0.02); color: #444; }

  .cname { flex: 1; font-size: 14px; color: #888; }
  .candidate-row.leader .cname { color: #f0ede8; }
  .vote-count { font-family: 'Georgia', serif; font-size: 19px; color: #555; }
  .candidate-row.leader .vote-count { color: #f0ede8; }
  .pct { font-size: 11px; color: #333; min-width: 36px; text-align: right; }
  .candidate-row.leader .pct { color: #888; }

  .loading { text-align: center; padding: 3rem; color: #444; font-size: 14px; }

  /* Admin panel */
  .admin-panel { background: rgba(0,0,0,0.45); border: 0.5px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem; }
  .admin-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ccc; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
  .admin-title::before { content: ''; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
  .admin-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .admin-row:last-child { margin-bottom: 0; }
  .admin-row label { font-size: 11px; color: #555; min-width: 80px; }
  .admin-row input { flex: 1; background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 7px; padding: 8px 12px; font-size: 13px; color: #f0ede8; font-family: Arial, sans-serif; outline: none; }
  .admin-row input:focus { border-color: rgba(255,255,255,0.3); }
  .admin-btn { padding: 8px 16px; font-size: 12px; font-family: Arial, sans-serif; cursor: pointer; border-radius: 7px; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); color: #f0ede8; transition: background 0.15s; white-space: nowrap; }
  .admin-btn:hover { background: rgba(255,255,255,0.13); }
  .admin-btn.danger { border-color: rgba(180,60,60,0.4); color: #c07070; }
  .admin-btn.danger:hover { background: rgba(180,60,60,0.1); }
  .admin-msg { font-size: 12px; color: #555; margin-top: 8px; min-height: 18px; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
  .dot-open { background: #4caf82; }
  .dot-closed { background: #c07070; }

  .comments-section { margin-bottom: 1.75rem; }
  .comment-card { background: rgba(0,0,0,0.45); border: 0.5px solid rgba(255,255,255,0.06); border-radius: 9px; padding: 12px 15px; margin-bottom: 8px; }
  .comment-card:last-child { margin-bottom: 0; }
  .comment-name { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .comment-text { font-size: 14px; color: #c8c0b0; line-height: 1.5; }
  .no-comments { font-size: 13px; color: #444; text-align: center; padding: 1rem; }
  .footer { text-align: center; padding-top: 2.5rem; font-size: 10px; color: #2a2a2a; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <span class="auth-icon">♟</span>
    <h2>AUPP Chess Club</h2>
    <p>Results · Authorised access only</p>
    <input type="password" id="pwd-input" placeholder="Enter password">
    <button class="auth-btn" onclick="submitPassword()">View Results →</button>
    <p class="pwd-err" id="pwd-err">Incorrect password. Try again.</p>
  </div>
</div>

<!-- Main Content -->
<div id="main-content">
  <div class="wrap">
    <div class="header">
      <span class="chess-symbol">♟</span>
      <h1>AUPP Chess Club</h1>
      <p class="sub">Officer Election · AY 2025–26 · Live Results</p>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="total-votes">—</div><div class="stat-label">Votes cast</div></div>
      <div class="stat-card"><div class="stat-num">13</div><div class="stat-label">Candidates</div></div>
      <div class="stat-card"><div class="stat-num">3</div><div class="stat-label">Positions</div></div>
    </div>

    <div class="refresh-row">
      <span class="last-updated" id="last-updated">Connecting…</span>
      <button class="refresh-btn" onclick="load()">↻ Refresh</button>
    </div>

    <!-- Admin panel -->
  <div class="admin-panel">
    <p class="admin-title">Admin Controls</p>
    <div class="admin-row">
      <label>Status</label>
      <span id="vote-status" style="font-size:13px; color:#555;">Checking…</span>
    </div>
    <div class="admin-row">
      <label>Deadline</label>
      <input type="datetime-local" id="deadline-input">
      <button class="admin-btn" onclick="setDeadline()">Set</button>
    </div>
    <div class="admin-row">
      <label>Data</label>
      <button class="admin-btn danger" onclick="confirmClear()">Clear all votes now</button>
    </div>
    <p class="admin-msg" id="admin-msg"></p>
  </div>

  <div id="results"><div class="loading">Loading results…</div></div>
    <div class="footer">AUPP Chess Club — internal use only</div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxA1E-98pTFeSMa7Q2JBaptuKarVSC-jxWkiLT_Q9zBXSsUmYB7wP-oC4WlXhvnq2OX/exec";
  const PASSWORD   = "Chess@0521";
  const AUTH_KEY   = "aupp_chess_results_auth";

  const POSITIONS = {
    president: { label: "President",      candidates: ["Mohasal Lykunthy","Ritheasak","Kimsang","Sokundara","Lim Sunhout"] },
    vp:        { label: "Vice President", candidates: ["Pha Lina","Sokundara","Venghong","Ritheasak","Koun Chealinritheasak"] },
    officer:   { label: "Club Officer",   candidates: ["Lim Sunhout","Kimsang","Lo Sovannara"] }
  };

  // ── Auth ──────────────────────────────────────────────────────────────────
  function checkAuth() {
    if (sessionStorage.getItem(AUTH_KEY) === "1") {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      load();
      setInterval(load, 30000);
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('main-content').style.display = 'none';
    }
  }

  function submitPassword() {
    const input = document.getElementById('pwd-input').value;
    if (input === PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, "1");
      checkAuth();
    } else {
      document.getElementById('pwd-err').style.display = 'block';
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitPassword();
    });
    checkAuth();
  });

  // ── Results ───────────────────────────────────────────────────────────────
  function rankClass(i) { return ['rank-1','rank-2','rank-3'][i] || 'rank-other'; }

  function renderPosition(posKey, counts) {
    const { label, candidates } = POSITIONS[posKey];
    const entries = candidates.map(c => [c, counts[c]||0]).sort((a,b) => b[1]-a[1]);
    const total = entries.reduce((s,[,v]) => s+v, 0);
    const max = entries[0]?.[1] || 1;
    const rows = entries.map(([name, votes], i) => {
      const pct = total > 0 ? Math.round(votes/total*100) : 0;
      const barW = max > 0 ? Math.round(votes/max*100) : 0;
      const leader = i === 0 && votes > 0;
      return `<div class="candidate-row${leader?' leader':''}">
        <div class="bar-fill" style="width:${barW}%"></div>
        <div class="row-content">
          <div class="rank-badge ${rankClass(i)}">${i+1}</div>
          <span class="cname">${name}</span>
          <span class="vote-count">${votes}</span>
          <span class="pct">${pct}%</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="section">
      <div class="section-header"><span class="section-title">${label}</span><div class="section-line"></div></div>
      ${rows}
    </div>`;
  }

  function render(data) {
    document.getElementById('total-votes').textContent = data.totalVotes;
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    const posHTML = Object.keys(POSITIONS).map(k => renderPosition(k, data[k]||{})).join('');
    const comments = data.comments || [];
    const commentsHTML = `
      <div class="comments-section">
        <div class="section-header"><span class="section-title">Comments</span><div class="section-line"></div></div>
        ${comments.length === 0
          ? '<div class="no-comments">No comments yet.</div>'
          : comments.map(c => `
            <div class="comment-card">
              <div class="comment-name">${c.name}</div>
              <div class="comment-text">${c.comment}</div>
            </div>`).join('')}
      </div>`;
    document.getElementById('results').innerHTML = posHTML + commentsHTML;
  }

  const ADMIN_KEY = "Chess@0521";

  function setDeadline() {
    const dl = document.getElementById('deadline-input').value;
    if (!dl) { document.getElementById('admin-msg').textContent = 'Pick a date first.'; return; }
    const url = `${SCRIPT_URL}?action=setDeadline&deadline=${encodeURIComponent(dl)}&adminKey=${ADMIN_KEY}`;
    window.open(url, '_blank');
    document.getElementById('admin-msg').textContent = '✓ A tab opened to confirm — close it and refresh results.';
    setTimeout(load, 3000);
  }

  function confirmClear() {
    if (!confirm('Clear ALL votes permanently? This cannot be undone.')) return;
    const url = `${SCRIPT_URL}?action=clearVotes&adminKey=${ADMIN_KEY}`;
    window.open(url, '_blank');
    document.getElementById('admin-msg').textContent = '✓ A tab opened to confirm — close it and refresh results.';
    setTimeout(load, 3000);
  }

  async function load() {
    try {
      const res = await fetch(SCRIPT_URL, { cache: 'no-store' });
      render(await res.json());
    } catch {
      document.getElementById('results').innerHTML = '<div class="loading" style="color:#6a3030">Failed to load — check your Script URL.</div>';
      document.getElementById('last-updated').textContent = 'Connection failed';
    }
  }
</script>
</body>
</html>
