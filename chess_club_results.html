<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPP Chess Club — Election Results</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0b;
    color: #c8c0b0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem 5rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 700px;
    background: radial-gradient(ellipse at center top, rgba(201,168,76,0.12) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 500px;
    background: radial-gradient(ellipse at center bottom, rgba(201,168,76,0.06) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  .wrap { max-width: 620px; margin: 0 auto; position: relative; z-index: 1; }

  .header { text-align: center; padding: 3rem 0 2rem; border-bottom: 0.5px solid rgba(201,168,76,0.15); margin-bottom: 2rem; }
  .chess-symbol { font-size: 48px; display: block; margin-bottom: 14px; filter: drop-shadow(0 0 18px rgba(201,168,76,0.6)) drop-shadow(0 0 40px rgba(201,168,76,0.25)); }
  .header h1 { font-family: 'Georgia', serif; font-size: 24px; font-weight: normal; color: #f5e6bb; letter-spacing: 0.06em; margin-bottom: 6px; }
  .header .sub { font-size: 11px; color: #5a5144; letter-spacing: 0.14em; text-transform: uppercase; }

  .stats { display: flex; gap: 12px; margin-bottom: 2rem; }
  .stat-card { flex: 1; background: rgba(201,168,76,0.05); border: 0.5px solid rgba(201,168,76,0.18); border-radius: 12px; padding: 1.1rem; text-align: center; }
  .stat-num { font-family: 'Georgia', serif; font-size: 30px; color: #c9a84c; text-shadow: 0 0 20px rgba(201,168,76,0.3); }
  .stat-label { font-size: 10px; color: #4a4236; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

  .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
  .last-updated { font-size: 11px; color: #332e28; }
  .refresh-btn { font-size: 11px; padding: 6px 14px; border-radius: 6px; border: 0.5px solid rgba(201,168,76,0.2); background: transparent; color: #6a5f44; cursor: pointer; transition: color 0.15s, border-color 0.15s, background 0.15s; }
  .refresh-btn:hover { color: #c9a84c; border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.06); }

  .section { margin-bottom: 1.75rem; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #c9a84c; white-space: nowrap; }
  .section-line { flex: 1; height: 0.5px; background: rgba(201,168,76,0.12); }

  .candidate-row { position: relative; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.04); border-radius: 9px; padding: 12px 15px; margin-bottom: 8px; background: rgba(255,255,255,0.02); }
  .candidate-row:last-child { margin-bottom: 0; }
  .candidate-row.leader { border-color: rgba(201,168,76,0.28); background: rgba(201,168,76,0.05); box-shadow: inset 0 0 30px rgba(201,168,76,0.04), 0 0 20px rgba(201,168,76,0.06); }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(201,168,76,0.07); border-radius: 9px; transition: width 1s cubic-bezier(0.4,0,0.2,1); pointer-events: none; }
  .candidate-row.leader .bar-fill { background: rgba(201,168,76,0.11); }
  .row-content { position: relative; display: flex; align-items: center; gap: 12px; }
  .rank-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .rank-1 { background: rgba(201,168,76,0.2); color: #c9a84c; box-shadow: 0 0 10px rgba(201,168,76,0.2); }
  .rank-2 { background: rgba(143,160,176,0.12); color: #8fa0b0; }
  .rank-3 { background: rgba(160,120,90,0.12); color: #a0785a; }
  .rank-other { background: rgba(255,255,255,0.03); color: #333; }
  .cname { flex: 1; font-size: 14px; color: #b0a898; }
  .candidate-row.leader .cname { color: #e8d898; }
  .vote-count { font-family: 'Georgia', serif; font-size: 19px; color: #5a5040; }
  .candidate-row.leader .vote-count { color: #c9a84c; text-shadow: 0 0 12px rgba(201,168,76,0.3); }
  .pct { font-size: 11px; color: #2e2922; min-width: 36px; text-align: right; }
  .candidate-row.leader .pct { color: rgba(201,168,76,0.45); }

  .loading { text-align: center; padding: 3rem; color: #4a4236; font-size: 14px; }
  .footer { text-align: center; padding-top: 2.5rem; font-size: 10px; color: #222018; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="chess-symbol">♟</span>
    <h1>AUPP Chess Club</h1>
    <p class="sub">Officer Election · AY 2025–26 · Live Results</p>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="total-votes">—</div><div class="stat-label">Votes cast</div></div>
    <div class="stat-card"><div class="stat-num">13</div><div class="stat-label">Candidates</div></div>
    <div class="stat-card"><div class="stat-num">3</div><div class="stat-label">Positions</div></div>
  </div>

  <div class="refresh-row">
    <span class="last-updated" id="last-updated">Connecting…</span>
    <button class="refresh-btn" onclick="load()">↻ Refresh</button>
  </div>

  <div id="results"><div class="loading">Loading results…</div></div>
  <div class="footer">AUPP Chess Club &mdash; internal use only</div>
</div>

<script>
  const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";

  const POSITIONS = {
    president: { label: "♛  President",      candidates: ["Mohasal Lykunthy","Ritheasak","Kimsang","Sokundara","Lim Sunhout"] },
    vp:        { label: "♜  Vice President", candidates: ["Pha Lina","Sokundara","Venghong","Ritheasak","Koun Chealinritheasak"] },
    officer:   { label: "♞  Club Officer",   candidates: ["Lim Sunhout","Kimsang","Lo Sovannara"] }
  };

  function rankClass(i) { return ['rank-1','rank-2','rank-3'][i] || 'rank-other'; }

  function renderPosition(posKey, counts) {
    const { label, candidates } = POSITIONS[posKey];
    const entries = candidates.map(c => [c, counts[c]||0]).sort((a,b) => b[1]-a[1]);
    const total = entries.reduce((s,[,v]) => s+v, 0);
    const max = entries[0]?.[1] || 1;
    const rows = entries.map(([name, votes], i) => {
      const pct = total > 0 ? Math.round(votes/total*100) : 0;
      const barW = max > 0 ? Math.round(votes/max*100) : 0;
      const leader = i === 0 && votes > 0;
      return `<div class="candidate-row${leader?' leader':''}">
        <div class="bar-fill" style="width:${barW}%"></div>
        <div class="row-content">
          <div class="rank-badge ${rankClass(i)}">${i+1}</div>
          <span class="cname">${name}</span>
          <span class="vote-count">${votes}</span>
          <span class="pct">${pct}%</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="section">
      <div class="section-header"><span class="section-title">${label}</span><div class="section-line"></div></div>
      ${rows}
    </div>`;
  }

  function render(data) {
    document.getElementById('total-votes').textContent = data.totalVotes;
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('results').innerHTML = Object.keys(POSITIONS).map(k => renderPosition(k, data[k]||{})).join('');
  }

  async function load() {
    try {
      const res = await fetch(SCRIPT_URL, { cache: 'no-store' });
      render(await res.json());
    } catch {
      document.getElementById('results').innerHTML = '<div class="loading" style="color:#6a3030">Failed to load — check your Script URL.</div>';
      document.getElementById('last-updated').textContent = 'Connection failed';
    }
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
